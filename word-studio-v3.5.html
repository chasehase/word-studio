const raw=[
['mysterious','Strange and difficult to explain or understand.','神秘的；難以理解的','mystery|n|謎團;mysterious|adj|神秘的;mysteriously|adv|神秘地','A ~mysterious~ stranger knocked on our door late at night.|The old man disappeared ~mysteriously~ without leaving a note.|The detective finally solved the ~mystery~ of the missing painting.'],
['transform','To change something or someone completely, usually to make it better.','徹底改變','transformation|n|轉變;transform|v|徹底改變;transformative|adj|帶來重大改變的',"The film shows the hero’s amazing ~transformation~ from a shy boy into a brave leader.|Smartphones have had a ~transformative~ effect on the way we communicate.|The new coach ~transformed~ the weak team into champions."],
['defeat','To win against someone in a game, fight or competition.','擊敗；戰勝','defeat|n|失敗;defeat|v|擊敗;defeated|adj|被擊敗的；沮喪的;undefeated|adj|未曾落敗的','The team suffered a heavy ~defeat~ in their first match of the season.|The players looked tired and ~defeated~ after losing the match.|The tennis champion has remained ~undefeated~ for three seasons.|Our school team ~defeated~ its rivals 3–1 in the final.'],
['faithful','Loyal and reliable; also, keeping closely to the original (e.g. a film that is faithful to the book).','忠誠的；忠於原著的','faith|n|信心；信念;faithfulness|n|忠誠；忠實程度;faithful|adj|忠誠的;faithfully|adv|忠誠地','The dog waited ~faithfully~ for its owner at the station every day.|The coach kept her ~faith~ in the team even when they were losing.|The actor was praised for the ~faithfulness~ of his performance to the real person.|Fans loved the film because it was ~faithful~ to the original novel.'],
['dazzling','Extremely bright or impressive, in a way that amazes you.','耀眼的；令人驚艷的','dazzle|n|耀眼光芒;dazzle|v|使驚艷;dazzling|adj|耀眼的;dazzlingly|adv|耀眼地','The magician ~dazzled~ the audience with his card tricks.|The diamond ring sparkled ~dazzlingly~ under the shop lights.|Behind the glamour and ~dazzle~ of the film industry, actors work very hard.|The concert ended with a ~dazzling~ display of fireworks.'],
['technically','In a way that is connected with skills, methods or machines.','技術上','technique|n|技巧;technician|n|技術員;technical|adj|技術的;technically|adv|技術上',"The singer has a lovely voice, but her breathing ~technique~ needs improving.|A ~technician~ came to repair the broken projector.|We had some ~technical~ problems with the sound system during the show.|The film’s special effects are ~technically~ impressive."],
['entertaining','Enjoyable and fun to watch, read or listen to.','有趣的；娛樂性高的','entertainment|n|娛樂;entertainer|n|表演者;entertain|v|娛樂;entertaining|adj|有趣的;entertainingly|adv|有趣地','The clown ~entertained~ the children at the birthday party.|The theme park offers a wide range of ~entertainment~ for families.|The famous ~entertainer~ has performed on stage for over 30 years.|I found the comedy show very ~entertaining~.'],
['precise','Exact and accurate in every detail.','精確的','precision|n|精確;precise|adj|精確的;precisely|adv|精確地',"Surgeons must work with great ~precision~.|The train arrived ~precisely~ at eight o’clock.|Please give me the ~precise~ time of your arrival."],
['resume','To start doing something again after a pause or break.','重新開始；恢復','resumption|n|恢復;resume|v|重新開始','Please ~resume~ your work quietly after the fire drill.|The audience cheered at the ~resumption~ of the concert after the power cut.|The football match ~resumed~ after the heavy rain stopped.'],
['thrilling','Very exciting.','刺激的','thrill|n|興奮感;thriller|n|驚險故事;thrill|v|使興奮;thrilling|adj|令人興奮的;thrilled|adj|感到興奮的','I was ~thrilled~ to hear that I had won the competition.|Riding a roller coaster gives me a real ~thrill~.|My favourite type of film is a spy ~thriller~.|The acrobats ~thrilled~ the crowd with their daring jumps.|The match had a ~thrilling~ ending, with a goal in the last minute.'],
['categorised','Put into groups according to type.','分類；被分類的','category|n|類別;categorise|v|分類;categorised|adj|被分類的','Please ~categorise~ these words into nouns, verbs and adjectives.|Horror films fall into a different ~category~ from comedies.|The books in the library are ~categorised~ by subject.'],
['imaginative','Having or showing new, creative and clever ideas.','富想像力的','imagination|n|想像力;imagine|v|想像;imaginative|adj|富想像力的;imaginary|adj|虛構的;imaginatively|adv|有創意地','Use your ~imagination~ to design a new superhero.|Can you ~imagine~ life without the Internet?|Many young children have ~imaginary~ friends.|The classroom was ~imaginatively~ decorated for Christmas.|The writer came up with an ~imaginative~ story about a talking cat.'],
['personalised','Made or changed to suit one particular person.','個人化的','person|n|人;personality|n|性格;personalise|v|個人化;personalised|adj|個人化的;personal|adj|個人的;personally|adv|親自','You can ~personalise~ your phone by changing the wallpaper.|In my ~personal~ opinion, the book is better than the film.|I would like to thank you ~personally~ for your help.|Our class monitor has a cheerful ~personality~.|My mum bought me a ~personalised~ mug with my name on it.'],
['visually','In a way that is connected with seeing or how something looks.','視覺上','vision|n|視力;visualise|v|想像畫面;visual|adj|視覺的;visually|adv|視覺上','Charts and pictures are useful ~visual~ aids in a presentation.|Close your eyes and ~visualise~ yourself scoring the winning goal.|My grandfather has poor ~vision~, so he needs glasses to read.|The film is ~visually~ stunning, with beautiful scenery.'],
['legendary','Very famous and admired; also, described in old stories (legends).','傳奇的','legend|n|傳說；傳奇人物;legendary|adj|傳奇的','According to ~legend~, a dragon once lived in the lake.|The footballer became a living ~legend~ after winning five league titles.|Bruce Lee is a ~legendary~ figure in the world of martial arts.']];
const extra={defeat:['The proposal was ~defeated~ by just one vote.'],transform:['A cheap table can be ~transformed~ by an interesting cover.'],faithful:['She had been ~faithful~ to her promise to guard this secret.'],resume:['The search is expected to ~resume~ early today.','The talks are due to ~resume~ today.'],thrilling:['Great chase scenes and effects make this a ~thrilling~ ride.'],categorised:['The tables were organised into six different ~categories~.'],personalised:["The clock has easy-to-read numbers and is ~personalised~ with the child's name and birth date."],dazzling:['But the illustrations are good and the exhibition is ~dazzling~.'],imaginative:['They should adopt a more ~imaginative~ approach.']};
const wordOrigins={"mysterious":["mysterious","Latin mysterium → mystery / mysterious","Latin mysterium referred to a secret or sacred matter. In English, mystery came to mean something unexplained; mysterious appeared in the early 1600s.","原本指秘密或神聖的事，後來指未解之謎。","Think of mystery + the adjective ending -ous. Remember mysteri-ous (not mysteryous); add -ly for mysteriously.","mystery → mysterious → mysteriously"],"transform":["transform","Latin trans + formare → transformare → transform","Trans meant across or beyond; formare meant to shape. English transform originally involved a change of shape and later also a change of character or condition.","由改變形狀引申至改變性質或狀態。","Think of changing from one form to another. Keep transform intact before -ation or -ative.","transform → transformation / transformative"],"defeat":["defeat","Latin dis- + facere → Old French desfaire → defeat","The older French verb meant to undo. English defeat developed senses of ruining or preventing success, then overcoming an opponent. The noun came from the verb.","由瓦解、破壞引申至擊敗對手。","Imagine undoing an opponent’s plan. Defeat can be a noun or verb; un- means not in undefeated.","defeat (noun / verb) → defeated / undefeated"],"faithful":["faithful","Latin fides → Old French feid / foi → faith","The older words expressed trust or belief. Faithful first described religious devotion, then loyalty and accuracy in representing facts.","由信任、信仰引申至忠誠及忠於原文。","Faith + -ful (one l). Add -ness for the quality or -ly for the manner; faithfully has two consecutive l letters.","faith → faithful → faithfulness / faithfully"],"dazzling":["dazzle","Middle English dasen → dazzle","Dazzle first described being bewildered. It later referred to overwhelming brightness, then to impressing someone greatly. The deeper origin of dasen is uncertain.","由令人迷惘引申至光線刺眼，再到令人驚艷。更早來源未確定。","Think of bright fireworks that amaze you. Drop final e before -ing; add -ly to dazzling.","dazzle (noun / verb) → dazzling → dazzlingly"],"technically":["technical","Greek tekhnē → tekhnikos → Latin technicus","Tekhnē referred to skilled work or craft. The family later developed words about specialised methods and practical skills. Technique came through French.","原指技藝或專門技巧，後來用於專業方法及技術。","A technique is a method; a technician is a skilled worker. Technical + -ly gives technically.","technique / technician / technical → technically"],"entertaining":["entertain","Old French entretenir → entertain","The French verb combined ideas of being among others and holding or maintaining something. English later used entertain for receiving guests and amusing people.","由維持、接待客人引申至娛樂別人。","Think of holding an audience’s attention (a memory trick, not a literal historical definition). Add -ment for the activity and -er for the person.","entertain → entertainment / entertainer / entertaining → entertainingly"],"precise":["precise","Latin praecidere → praecisus → precise","The Latin verb referred to cutting something off or shortening it. The adjective developed the sense of being exact; precision shares the same Latin root.","由切去多餘部分引申至準確、精確。","Imagine trimming away everything unnecessary. Remember precise → precision (drop final e, add -ion); precise + -ly.","precise → precision / precisely"],"resume":["resume","Latin re- + sumere → resumere → resume","The Latin verb combined again with taking. English first used resume for taking something back, then for continuing an interrupted activity. Resumption comes from the related Latin noun stem resumpt-.","由重新取回引申至中斷後重新開始。","Re- reminds you of again. Memorise resume and resumption as a pair: the noun contains a p.","resume → resumption"],"thrilling":["thrill","Old English þyrlian → Middle English thirlen → thrill","The early verb referred to piercing something. It later described a strong emotional feeling, then excitement or a shiver of excitement.","由刺穿引申至強烈觸動情緒及興奮感。","Imagine excitement running through you. Thrilling describes the cause; thrilled describes how someone feels. A thriller is an exciting story.","thrill (noun / verb) → thriller / thrilling / thrilled"],"categorised":["category","Greek katēgoria → Latin categoria → French catégorie","The Greek word was used in philosophy for classes of things that could be named or described. English later used category for a broad class of things.","由哲學上的分類概念演變為一般的類別。","Think of sorting items into labelled groups. Category → categorise: replace final y with -ise; use British spelling.","category → categorise → categorised"],"imaginative":["imaginative","Latin imago → imaginari → imaginative","Imago referred to a likeness or image; imaginari referred to forming a mental image. The family developed meanings related to mental pictures and imagination.","由圖像引申至在腦海中形成畫面及想像。","Imagine a picture in your mind. Imaginary means not real; imaginative means creative. Remember imagination and imaginatively.","imagine → imagination / imaginary / imaginative → imaginatively"],"personalised":["personalize","Latin persona → personalis → personal","Persona referred to a person or dramatic role and historically also a theatrical mask. Personalise developed from personal in the 1700s. The deeper origin of persona is uncertain.","由人物、角色引申至個人的，再到為個人度身訂造。","A personalised gift is made for one person. Personalise uses British -ise; personality describes character; personally is an adverb.","person → personal / personality → personalise → personalised; personal → personally"],"visually":["visual","Latin videre → visus / visio → visual / vision","Videre meant to see. Visual and vision come from related Latin forms referring to sight or seeing.","同源於「看見」，引申至視力及視覺。","Think of seeing: vision is sight, visual relates to sight, visualise means forming a mental picture, visually describes appearance or sight.","vision / visual → visualise / visually"],"legendary":["legend","Latin legere → legenda → legend","Legere included the sense of reading. Medieval legenda referred to readings, especially accounts of saints. Legend later included mythical stories; legendary came from a related Medieval Latin adjective.","由供閱讀的故事引申至傳說及傳奇人物。","Think of a story worth retelling. A legend is a story or admired person; legendary describes something famous or associated with legends.","legend → legendary"]};
const originStages={"mysterious":[["Latin",[["mysterium","secret or sacred matter"]]],["English · related words",[["mystery","something unexplained"],["mysterious","difficult to explain"]]]],"transform":[["Latin",[["trans-","across or beyond"],["formare","to shape"]]," + "],["Latin",[["transformare","to change shape"]]],["English",[["transform","to change completely"]]]],"defeat":[["Latin roots",[["dis-","apart / reversal"],["facere","to do or make"]]," + "],["Old French",[["desfaire","to undo"]]],["English",[["defeat","to overcome an opponent"]]]],"faithful":[["Latin",[["fides","trust or belief"]]],["Old French",[["feid / foi","faith or belief"]]],["English",[["faith","trust or belief"]]],["English · word formation",[["faith","trust"],["-ful","full of"]]," + "],["English",[["faithful","loyal; true"]]]],"dazzling":[["Middle English",[["dasen","to be bewildered"]]],["English",[["dazzle","to overwhelm with brightness or impress"]]],["English",[["dazzling","extremely bright or impressive"]]]],"technically":[["Greek",[["tekhnē","craft or skill"]]],["Greek",[["tekhnikos","relating to skill"]]],["Latin",[["technicus","relating to an art or skill"]]],["English",[["technical","relating to specialised skills"]]],["English",[["technically","in a technical sense"]]]],"entertaining":[["Old French",[["entretenir","to hold or maintain"]]],["English",[["entertain","to receive guests or amuse"]]],["English",[["entertaining","amusing or enjoyable"]]]],"precise":[["Latin",[["praecidere","to cut off or shorten"]]],["Latin",[["praecisus","cut off"]]],["English",[["precise","exact"]]]],"resume":[["Latin",[["re-","again"],["sumere","to take"]]," + "],["Latin",[["resumere","to take up again"]]],["English",[["resume","to continue after a break"]]]],"thrilling":[["Old English",[["þyrlian","to pierce"]]],["Middle English",[["thirlen","to pierce"]]],["English",[["thrill","strong excitement"]]],["English",[["thrilling","causing excitement"]]]],"categorised":[["Greek",[["katēgoria","a philosoph function trackLabel(t){return mode==='Today'?`<span>TODAY’S CHALLENGE</span><span>${t.total-t.done} remaining</span>`:'FOUNDATION LEARNING · '+Math.round(100*t.done/t.total)+'% completed · '+(t.total-t.done)+' remaining';}

function dailyTrack(){let d=daily();if(!d.mixed){let all=sections.flatMap(k=>levels(k).flatMap(l=>pool(k,l)));let items=[],used=new Set();let add=p=>{let q=pick(p.filter(q=>!used.has(dailyFormKey(q))));if(q){items.push(q);used.add(dailyFormKey(q))}};let plan=shuffle([['Spelling','type'],['Spelling','type'],['Spelling','type'],['Spelling','type'],['Spelling','type'],['Spelling','type'],['Word forms','type'],['Word forms','type'],['Word forms','context'],['Word forms','context'],['Word forms','context'],['Word forms','context'],['Fill in','bank'],['Fill in','bank'],['Fill in','type'],['Fill in','type'],['Fill in','mixed'],['Fill in','mixed']]);for(let w of shuffle(words)){let i=plan.findIndex(([k,l])=>all.some(q=>q.base===w.base&&q.kind===k&&q.level===l&&!used.has(dailyFormKey(q))));if(i>=0){let [k,l]=plan.splice(i,1)[0];add(all.filter(q=>q.base===w.base&&q.kind===k&&q.level===l))}else add(all.filter(q=>q.base===w.base))}for(let [k,l] of plan){if(items.length>=18)break;add(all.filter(q=>q.kind===k&&q.level===l))}while(items.length<18){let n=items.length;add(all);if(n===items.length)break}d.mixed={queue:shuffle(items),done:0,total:items.length,version:3};save()}return d.mixed;}

function streak(){let n=0,d=new Date();let key=()=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let earned=()=>{let v=db.daily[key()];return dayComplete(v)&&!v?.teacherSkipped};if(!earned())d.setDate(d.getDate()-1);while(earned()){n++;d.setDate(d.getDate()-1)}return n;}

function setup(){let f=foundation();if(mode==='Today'){if(!f.completed||dayComplete(daily())){session=null;today();return;}return tracked(dailyTrack());}if(!f.completed){if(stageNames[f.stage]!==mode){locked('Complete the previous Foundation Learning stage first.',continueFoundation,'Continue Foundation Learning');return;}if(!f.track){let queue=foundationPool(f.stage);f.track={queue,done:0,total:queue.length};save();}return tracked(f.track);}if(!dayComplete(daily())){locked("Complete today's challenge to unlock practice and review.",()=>go('Today'),"Go to Today's Challenge");return;}if(!practiceMode)return practiceMenu();return nextPractice();}

const masteryKinds=['Spelling','Word forms','Fill in'];
const masteryWeights=[.30,.35,.35];
const masteryLabels=['Spelling','Word Forms','Meaning & Usage'];
function editDistance(a,b){let d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[a.length][b.length];}
function classifyMastery(q,value){let a=q.answer.toLowerCase(),v=value.trim().toLowerCase();if(a===v)return ['Correct',100];let w=words.find(w=>w.base===q.base);let form=dailyFormKey(q).split('|').slice(1),lemma=form[0],pos=form[1];let inflect=(x)=>[x,x+'s',x+'es',x+'ed',x+'d',x+'ing',x.replace(/e$/,'')+'ing',x.replace(/y$/,'ies'),x.replace(/y$/,'ied')];if(w.forms.some(f=>f[0]===v&&f[1]!==pos&&!w.forms.some(g=>g[0]===v&&g[1]===pos)))return ['Word form mistakes',40];if((pos==='v'||pos==='n')&&inflect(lemma).includes(v))return ['Tense / number mistakes',55];if(w.forms.some(f=>f[0]===v)||qs.some(x=>x.base===q.base&&x.answer.toLowerCase()===v))return ['Word form mistakes',40];if(forms.some(f=>f.base!==q.base&&f.answer===v)||qs.some(x=>x.base!==q.base&&x.answer.toLowerCase()===v))return ['Wrong vocabulary',10];let dist=editDistance(a,v);return dist===1?['Minor spelling mistakes',80]:dist<=2&&dist/a.length<=.4?['Major spelling mistakes',60]:['Wrong / unrecognised answer',10];}
function captureMastery(q,value,hints){db.masterySamples ||= [];let day=dayKey();if(db.masterySamples.some(r=>r.key===q.key&&r.day===day))return;let [error,points]=classifyMastery(q,value),bank=q.level==='bank'&&!!q.s;let cap=hints?(bank?85:[100,80,65,40][Math.min(3,hints)]):100;db.masterySamples.push({key:q.key,day,date:new Date().toISOString(),base:q.base,kind:q.kind,form:dailyFormKey(q),answer:q.answer,given:value,error,score:Math.min(points,cap),weight:bank?.5:1});}
function masteryData(){let samples=db.masterySamples||[];return words.map(w=>{let all=samples.filter(r=>r.base===w.base),recent=[],stats=masteryKinds.map(k=>{let a=all.filter(r=>r.kind===k).slice(-10);recent.push(...a);if(!a.length)return null;let sum=0,den=0;a.forEach((r,i)=>{let wt=r.weight*(i>=Math.max(0,a.length-5)?2:1);sum+=r.score*wt;den+=wt});return sum/den});let required=[...new Set(w.forms.map(f=>w.base+'|'+f[0]+'|'+f[1]))],covered=new Set(all.map(r=>r.form));let ready=all.length>=5&&stats.every(x=>x!==null),full=required.every(k=>covered.has(k));let score=ready?Math.min(full?100:79,stats.reduce((n,x,i)=>n+x*masteryWeights[i],0)):null;return {base:w.base,score,stats,required,covered,recent,n:all.length};});}

function renderMastery(){let data=masteryData(),rank=data.filter(w=>w.score!==null).sort((a,b)=>b.score-a.score),rest=data.filter(w=>w.score===null),overall=rank.length===15?Math.round(rank.reduce((n,w)=>n+w.score,0)/15):null;let stats=document.querySelector('.progress-stats');stats.className='mastery-stats';stats.insertAdjacentHTML('beforeend',`<div><div class="stat">${overall===null?'—':overall+'%'}</div>Overall mastery</div>`);let article=document.createElement('article');article.innerHTML='<div class="tag">VOCABULARY MASTERY</div>'+[...rank,...rest].map((w,i)=>`<button class="mastery-row" data-base="${w.base}" aria-expanded="false"><span class="mastery-word">${w.base}</span><span class="mastery-percent" style="color:${scoreColor(w.score)}">${w.score===null?'—':Math.round(w.score)+'%'}</span><span class="mastery-chevron" aria-hidden="true">⌄</span></button><div id="mastery-${w.base}" hidden></div>`).join('');stats.closest('article').after(article);article.querySelectorAll('button[data-base]').forEach(b=>b.onclick=()=>{let w=data.find(x=>x.base===b.dataset.base),panel=$('mastery-'+w.base),open=panel.hidden;article.querySelectorAll('button[data-base]').forEach(x=>{x.setAttribute('aria-expanded','false');$('mastery-'+x.dataset.base).hidden=true});if(!open)return;panel.hidden=false;b.setAttribute('aria-expanded','true');let counts={};w.recent.filter(r=>r.error!=='Correct').forEach(r=>counts[r.error]=(counts[r.error]||0)+1);panel.innerHTML=`<div class="mastery-detail">${w.score===null?'<p class="muted">Not enough practice · '+w.n+' recorded answers</p>':''}${w.stats.map((x,i)=>`<div class="mastery-line"><span>${masteryLabels[i]}</span><b>${x===null?'—':Math.round(x)+'%'}</b></div>`).join('')}<details><summary>Error patterns</summary>${Object.entries(counts).map(([k,n])=>`<div class="mastery-line"><span>${esc(k)}</span><b>${n}</b></div>`).join('')||'<p>No recorded errors.</p>'}${w.recent.filter(r=>r.error!=='Correct').slice(-5).map(r=>`<p>${esc(r.given)} → <b>${esc(r.a function stopPronunciation(){let old=activePronButton;activePronunciation=null;activePronButton=null;if(old)old.setAttribute('aria-pressed','false');if(window.speechSynthesis)window.speechSynthesis.cancel();}
function pronMessage(button,text){let status=document.createElement('span');status.className='pron-status';status.setAttribute('role','status');status.textContent=text;button.after(status);setTimeout(()=>status.remove(),4500);}
function playPronunciation(button){const word=button.dataset.pron,wasPlaying=activePronButton===button;stopPronunciation();if(wasPlaying)return;const synth=window.speechSynthesis;if(!synth||!window.SpeechSynthesisUtterance){pronMessage(button,'Speech playback is unavailable in this browser.');return;}const voices=synth.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase()==='en-gb');if(!voices.length){pronMessage(button,'British English voice unavailable. Check your device speech settings or try again.');return;}const voice=voices.find(v=>/natural|neural|premium|enhanced/i.test(v.name))||voices.find(v=>/google uk/i.test(v.name))||voices[0];const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.voice=voice;u.rate=1;activePronunciation=u;activePronButton=button;button.setAttribute('aria-pressed','true');const finish=()=>{if(activePronunciation===u){activePronunciation=null;activePronButton=null;button.setAttribute('aria-pressed','false');}};u.onend=finish;u.onerror=()=>{if(activePronunciation===u){finish();pronMessage(button,'Audio could not play. Please try again.');}};try{synth.speak(u);}catch(e){finish();pronMessage(button,'Audio could not play. Please try again.');}}
if(window.speechSynthesis)window.speechSynthesis.getVoices();
document.addEventListener('click',e=>{const b=e.target.closest('.pron-btn');if(b){e.preventDefault();playPronunciation(b);}});


// Teacher PIN: change this six-digit value before publishing if desired.
const TEACHER_PIN = '445087';
let teacherUnlocked = false;
function renderTeacherGate(){
  $('app').insertAdjacentHTML('beforeend',`<details><summary>Teacher records · local device <span aria-hidden="true">🔒</span></summary><p class="muted">Unlock Teacher Tools to view teacher records.</p><button type="button" id="teacherRecordsUnlock">Enter PIN</button></details><details id="teacherGate"><summary>Teacher Tools <span aria-hidden="true">🔒</span></summary><form id="teacherPinForm" class="stack" novalidate><label for="teacherPin">Teacher access</label><input id="teacherPin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off" placeholder="Enter 6-digit PIN"><button type="button" id="teacherUnlockButton" class="primary">Unlock</button><p id="teacherPinError" role="alert" hidden style="color:#b7443e">Incorrect PIN.</p></form></details>`);
  $('teacherRecordsUnlock').onclick=()=>{$('teacherGate').open=true;$('teacherPin').focus();};
  function unlock(e){e.preventDefault();if($('teacherPin').value.trim()!==TEACHER_PIN){$('teacherPinError').hidden=false;$('teacherPin').focus();return;}teacherUnlocked=true;progress();} $('teacherPinForm').onsubmit=unlock; $('teacherUnlockButton').onclick=unlock; $('teacherPin').onkeydown=e=>{if(e.key==='Enter')unlock(e);};
}
const teacherProtectedProgress=progress;
progress=function(){teacherProtectedProgress();if(teacherUnlocked){
  const tool=$('skipFoundation').closest('details');
  const records=$('export').closest('details');
  tool.open=true;
  for(const panel of [tool,records]){
    let wasOpen=panel.open;
    panel.addEventListener('toggle',()=>{
      if(!panel.isConnected||!teacherUnlocked)return;
      if(wasOpen&&!panel.open){teacherUnlocked=false;progress();return;}
      wasOpen=panel.open;
    });
  }
}};

</script></html>
